services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: searchengine-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: search_presentation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mkounga10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d search_presentation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - searchengine-network

  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: searchengine-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:mkounga10@db:5432/search_presentation
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - SECRET_KEY=flask-secret-key-change-in-production
      - FLASK_ENV=production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - FRONTEND_ORIGIN=http://localhost
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - searchengine-network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: searchengine-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - searchengine-network

# Persistent volumes
volumes:
  postgres_data:
    name: searchengine-postgres-data
  uploads_data:
    name: searchengine-uploads-data

# Network
networks:
  searchengine-network:
    name: searchengine-network
    driver: bridge
